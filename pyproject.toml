[project]
name = "pii-stream-guard"
version = "0.1.0"
description = "Streaming guardrail that redacts sensitive data from chunked LLM output"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "regex>=2026.9.29",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.mypy]
strict = true
files = ["src", "tests", "examples"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-regex>=2026.9.29.20261030",
]
